/* landing and legal pages: the game's palette and fonts, nothing else loaded */
:root{--room:#1c0e24;--room-2:#281430;--felt:#4f1233;--felt-hi:#7d2552;--pink:#ff8cc0;--pink-soft:#f6b6d4;--text:#f7e9f0;--text-2:#d9bccb;--muted:#a88a9b;--line:#48294f;--panel:#23112a;--panel-2:#2f1736;--f-display:"Source Serif 4","Noto Sans Georgian","Noto Sans Hebrew",Georgia,serif;--f-body:"Onest","Noto Sans Georgian","Noto Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:linear-gradient(168deg,#43183f 0%,var(--room) 52%,#22143a 100%) fixed,var(--room);color:var(--text);font:400 17px/1.6 var(--f-body);min-height:100vh}
a{color:var(--pink)}
a:hover{color:#ffb3d6}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:6px}
.wrap{width:min(1080px,100%);margin:0 auto;padding:0 20px;position:relative;z-index:1}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font:600 22px/1 var(--f-display)}
.logo svg{width:30px;height:30px}
.logo b{color:var(--pink);font-weight:700}
.top nav{margin-inline-start:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lang{background:none;border:1px solid var(--line);color:var(--text-2);border-radius:6px;padding:6px 12px;font:600 13px/1 var(--f-body);cursor:pointer;text-decoration:none}
.lang[aria-current="true"]{background:var(--pink);color:#1a0913;border-color:var(--pink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:14px 26px;font:700 17px/1 var(--f-body);text-decoration:none;border:1px solid var(--line);color:var(--text);background:var(--panel-2);transition:transform .15s,filter .15s}
.btn:hover{color:var(--text);border-color:var(--pink)}
.btn.primary{background:var(--pink);color:#1a0913;border-color:var(--pink)}
.btn.primary:hover{color:#1a0913;filter:brightness(1.05)}
.btn.small{padding:9px 16px;font-size:14px}
/* language menu */
.langsel{appearance:none;-webkit-appearance:none;background:var(--panel-2) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%276%27%3E%3Cpath d=%27M0 0l5 6 5-6z%27 fill=%27%23d9bccb%27/%3E%3C/svg%3E") no-repeat right 12px center;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 30px 8px 14px;font:600 14px/1 var(--f-body);cursor:pointer}
[dir=rtl] .langsel{background-position:left 12px center;padding:8px 14px 8px 30px}
.langsel option{background:var(--panel);color:var(--text)}
/* landing */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding:36px 0 56px}
.hero h1{font:600 clamp(34px,5vw,56px)/1.08 var(--f-display);margin:0 0 18px;letter-spacing:-.015em}
.hero h1 span{color:var(--pink)}
.hero p.lead{font-size:clamp(18px,2.2vw,21px);color:var(--text-2);margin:0 0 26px;max-width:34em}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;padding:0;list-style:none}
.badges li{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 10px;font-size:14px;color:var(--text-2)}
.shot{border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 24px 60px #0009;background:var(--felt);position:relative;z-index:1}
.shot img{display:block;width:100%;height:auto}
section{padding:40px 0}
h2{font:600 clamp(26px,3.6vw,38px)/1.15 var(--f-display);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.card .ic{font-size:26px;line-height:1}
.card h3{font:600 20px/1.25 var(--f-display);margin:12px 0 8px}
.card p{margin:0;color:var(--text-2);font-size:15.5px;line-height:1.55}
.nomoney{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--pink);border-radius:10px;padding:26px}
.nomoney .big{font:600 48px/1 var(--f-display);color:var(--pink)}
.nomoney p{margin:6px 0 0;color:var(--text-2)}
.nomoney h2{margin:0}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;padding-inline-start:66px;position:relative;color:var(--text-2)}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:20px;top:18px;width:32px;height:32px;border-radius:50%;background:transparent;border:1.5px solid var(--pink);color:var(--pink);font:600 17px/29px var(--f-display);text-align:center}
.steps b{color:var(--text);display:block;margin-bottom:4px}
.final{text-align:center;padding:56px 0 64px}
.final p{color:var(--text-2);margin:0 0 22px}
/* footer */
footer{border-top:1px solid var(--line);margin-top:30px;padding:26px 0 40px;color:var(--muted);font-size:14px}
footer .row{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
footer a{color:var(--text-2);text-decoration:none}
footer a:hover{color:var(--pink)}
footer .age{border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--text-2)}
/* legal documents */
.doc{max-width:760px;padding:10px 0 20px}
.doc h1{font:600 clamp(24px,5.6vw,44px)/1.12 var(--f-display);margin:10px 0 8px;hyphens:auto;overflow-wrap:break-word}
.doc .ver{color:var(--muted);font-size:14px;margin:0 0 28px}
.doc h2{font:600 clamp(19px,4.4vw,23px)/1.25 var(--f-display);margin:36px 0 12px;hyphens:auto;overflow-wrap:break-word}
.doc p,.doc li{color:var(--text-2)}
.doc li{margin:6px 0}
.doc strong{color:var(--text)}
.doc .note{background:var(--panel-2);border:1px solid var(--line);border-inline-start:3px solid var(--pink);border-radius:8px;padding:14px 16px;margin:18px 0}
.doc .toc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 18px 14px 34px;margin:0 0 10px}
.doc .toc li{margin:3px 0}
.doc .toc a{text-decoration:none}
.doc table{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px}
.doc th,.doc td{border:1px solid var(--line);padding:9px 10px;text-align:start;vertical-align:top;color:var(--text-2)}
.doc th{color:var(--text);background:var(--panel-2)}
.doclinks{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
html[data-lang="ru"] [data-l="en"],html[data-lang="en"] [data-l="ru"],html:not([data-lang]) [data-l="en"]{display:none!important}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:28px;padding-top:16px}
  .grid,.steps{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  body{font-size:16px}
  .wrap{padding:0 16px}
  .grid,.steps{grid-template-columns:1fr}
  .nomoney{grid-template-columns:1fr;gap:8px}
  .top .btn{display:none}
  .doc table{display:block;overflow-x:auto}
  .hero .cta .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
/* icons, suits and the line-art peony */
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card .ic{color:var(--pink)}
.card .suit{font:600 28px/1 var(--f-display);color:var(--text)}
.card .suit.red{color:var(--pink)}
