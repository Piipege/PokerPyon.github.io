<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Unbounded;font-weight:700;src:url(../src/fonts/Unbounded-700-latin.woff2)}
@font-face{font-family:Unbounded;font-weight:700;src:url(../src/fonts/Unbounded-700-cyrillic.woff2);unicode-range:U+0400-045F}
@font-face{font-family:Unbounded;font-weight:500;src:url(../src/fonts/Unbounded-500-latin.woff2)}
@font-face{font-family:Unbounded;font-weight:500;src:url(../src/fonts/Unbounded-500-cyrillic.woff2);unicode-range:U+0400-045F}
@font-face{font-family:Onest;font-weight:500;src:url(../src/fonts/Onest-500-latin.woff2)}
@font-face{font-family:Onest;font-weight:500;src:url(../src/fonts/Onest-500-cyrillic.woff2);unicode-range:U+0400-045F}
@font-face{font-family:Onest;font-weight:700;src:url(../src/fonts/Onest-700-latin.woff2)}
@font-face{font-family:Onest;font-weight:700;src:url(../src/fonts/Onest-700-cyrillic.woff2);unicode-range:U+0400-045F}
body{margin:0;background:#000}
.art{position:relative;overflow:hidden}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
 <!-- the mark: a spade -->
 <g id="bunny">
  <path fill="#ff8cc0" d="M0 -190 C70 -120 210 -50 210 70 C210 160 150 210 85 210 C50 210 22 196 8 176 C14 236 38 282 74 306 L-74 306 C-38 282 -14 236 -8 176 C-22 196 -50 210 -85 210 C-150 210 -210 160 -210 70 C-210 -50 -70 -120 0 -190 Z"/>
 </g>
 <radialGradient id="felt" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#8a2a5c"/><stop offset=".7" stop-color="#4f1233"/><stop offset="1" stop-color="#3a0c26"/></radialGradient>
 <radialGradient id="room" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#3a1029"/><stop offset="1" stop-color="#140810"/></radialGradient>
</defs></svg>

<!-- AVATAR 1024x1024 -->
<div class="art" id="avatar" style="width:1024px;height:1024px">
<svg width="1024" height="1024" viewBox="0 0 1024 1024">
 <rect width="1024" height="1024" fill="url(#room)"/>
 <circle cx="512" cy="512" r="470" fill="url(#felt)"/>
 <circle cx="512" cy="512" r="470" fill="none" stroke="#ff8cc0" stroke-width="20"/>
 <circle cx="512" cy="512" r="438" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3" stroke-dasharray="14 18"/>
 <use href="#bunny" transform="translate(512 470) scale(1.3)"/>
</svg></div>

<!-- COVER 2560x640 -->
<div class="art" id="cover" style="width:2560px;height:640px;background:radial-gradient(ellipse 60% 120% at 50% 50%,#3d1029,#170912 70%)">
 <svg width="2560" height="640" viewBox="0 0 2560 640" style="position:absolute;inset:0">
  <ellipse cx="1280" cy="780" rx="1500" ry="420" fill="url(#felt)" opacity=".9"/>
  <ellipse cx="1280" cy="780" rx="1500" ry="420" fill="none" stroke="#ff8cc0" stroke-opacity=".5" stroke-width="6"/>
  <g fill="#ffffff" opacity=".05" font-family="Unbounded" font-size="120">
   <text x="140" y="190">♠</text><text x="2330" y="170">♥</text><text x="300" y="560">♦</text><text x="2200" y="560">♣</text>
  </g>
 </svg>
 <!-- cards and chips, left and right, outside the central safe zone -->
 <div style="position:absolute;left:150px;top:150px;transform:rotate(-14deg)"><div style="width:190px;height:266px;border-radius:20px;background:linear-gradient(160deg,#fff,#f6e9ef);box-shadow:0 24px 50px #0009;position:relative;color:#1a0913;font-family:Unbounded;font-weight:700"><div style="position:absolute;left:18px;top:14px;font-size:44px;line-height:1">A<div style="font-size:38px">♠</div></div><div style="position:absolute;right:20px;bottom:14px;font-size:96px;line-height:1">♠</div></div></div>
 <div style="position:absolute;left:300px;top:170px;transform:rotate(6deg)"><div style="width:190px;height:266px;border-radius:20px;background:linear-gradient(160deg,#fff,#f6e9ef);box-shadow:0 24px 50px #0009;position:relative;color:#c2185b;font-family:Unbounded;font-weight:700"><div style="position:absolute;left:18px;top:14px;font-size:44px;line-height:1">K<div style="font-size:38px">♥</div></div><div style="position:absolute;right:20px;bottom:14px;font-size:96px;line-height:1">♥</div></div></div>
 <div style="position:absolute;right:300px;top:160px;transform:rotate(-7deg)"><div style="width:190px;height:266px;border-radius:20px;background:linear-gradient(160deg,#fff,#f6e9ef);box-shadow:0 24px 50px #0009;position:relative;color:#c2185b;font-family:Unbounded;font-weight:700"><div style="position:absolute;left:18px;top:14px;font-size:44px;line-height:1">Q<div style="font-size:38px">♦</div></div><div style="position:absolute;right:20px;bottom:14px;font-size:96px;line-height:1">♦</div></div></div>
 <div style="position:absolute;right:140px;top:140px;transform:rotate(13deg)"><div style="width:190px;height:266px;border-radius:20px;background:linear-gradient(160deg,#fff,#f6e9ef);box-shadow:0 24px 50px #0009;position:relative;color:#1a0913;font-family:Unbounded;font-weight:700"><div style="position:absolute;left:18px;top:14px;font-size:44px;line-height:1">J<div style="font-size:38px">♣</div></div><div style="position:absolute;right:20px;bottom:14px;font-size:96px;line-height:1">♣</div></div></div>
 <div style="position:absolute;left:150px;top:420px;width:120px;height:120px;border-radius:50%;background:#ff5fa2;box-shadow:0 16px 30px #0008,inset 0 0 0 12px #ffffff55,inset 0 0 0 22px #ff5fa2,inset 0 0 0 26px #ffffff88;transform:rotate(10deg)"></div><div style="position:absolute;left:250px;top:470px;width:120px;height:120px;border-radius:50%;background:#7d2552;box-shadow:0 16px 30px #0008,inset 0 0 0 12px #ffffff55,inset 0 0 0 22px #7d2552,inset 0 0 0 26px #ffffff88;transform:rotate(-20deg)"></div><div style="position:absolute;left:560px;top:440px;width:120px;height:120px;border-radius:50%;background:#f6b6d4;box-shadow:0 16px 30px #0008,inset 0 0 0 12px #ffffff55,inset 0 0 0 22px #f6b6d4,inset 0 0 0 26px #ffffff88;transform:rotate(0deg)"></div><div style="position:absolute;right:560px;top:450px;width:120px;height:120px;border-radius:50%;background:#ff5fa2;box-shadow:0 16px 30px #0008,inset 0 0 0 12px #ffffff55,inset 0 0 0 22px #ff5fa2,inset 0 0 0 26px #ffffff88;transform:rotate(15deg)"></div><div style="position:absolute;right:180px;top:430px;width:120px;height:120px;border-radius:50%;background:#f6b6d4;box-shadow:0 16px 30px #0008,inset 0 0 0 12px #ffffff55,inset 0 0 0 22px #f6b6d4,inset 0 0 0 26px #ffffff88;transform:rotate(-8deg)"></div><div style="position:absolute;right:300px;top:480px;width:120px;height:120px;border-radius:50%;background:#7d2552;box-shadow:0 16px 30px #0008,inset 0 0 0 12px #ffffff55,inset 0 0 0 22px #7d2552,inset 0 0 0 26px #ffffff88;transform:rotate(30deg)"></div>
 <!-- centre: mascot + wordmark -->
 <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:48px">
  <svg width="300" height="350" viewBox="-230 -210 460 540"><use href="#bunny"/></svg>
  <div>
   <div style="font:700 150px/1 Unbounded;color:#fff;letter-spacing:.01em">Pyon<span style="color:#ff8cc0">Poker</span></div>
  </div>
 </div>
</div>
<!-- OG preview 1200x630 (links in messengers and social networks) -->
<div class="art" id="og" style="width:1200px;height:630px;background:radial-gradient(ellipse 70% 90% at 50% 45%,#4a1433,#170912 72%)">
 <svg width="1200" height="630" viewBox="0 0 1200 630" style="position:absolute;inset:0"><ellipse cx="600" cy="760" rx="820" ry="300" fill="url(#felt)"/><ellipse cx="600" cy="760" rx="820" ry="300" fill="none" stroke="#ff8cc0" stroke-opacity=".5" stroke-width="5"/></svg>
 <div style="position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:36px">
  <svg width="190" height="224" viewBox="-230 -210 460 540"><use href="#bunny"/></svg>
  <div style="font:700 112px/1 Unbounded;color:#fff">Pyon<span style="color:#ff8cc0">Poker</span></div>
 </div>
</div>
</body></html>
